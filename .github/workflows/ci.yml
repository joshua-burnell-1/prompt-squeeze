# ABOUTME: CI for prompt-squeeze - runs lint and the full pytest suite on push and PR.
# ABOUTME: Pinned to Python 3.12; uv handles dep resolution and venv.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Eval harness (no --judge)
        run: uv run python skills/prompt-squeeze/scripts/eval/run_eval.py

  hook-py39-compat:
    # The UserPromptSubmit hook runs under whatever python3 is on the user's PATH,
    # which on macOS is often the system Python 3.9. Verify the hook still imports
    # cleanly under 3.9.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Hook stdlib import smoke test
        run: |
          python -c "import importlib.util; spec=importlib.util.spec_from_file_location('h','hooks/user_prompt_submit.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('hook imports clean under', __import__('sys').version.split()[0])"
